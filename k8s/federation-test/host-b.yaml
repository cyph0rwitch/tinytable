apiVersion: v1
kind: Service
metadata:
  name: host-b
spec:
  selector:
    app.kubernetes.io/name: host-b
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: host-b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: host-b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: host-b
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [host-a, host-b]
              topologyKey: kubernetes.io/hostname
      containers:
        - name: tinytable
          image: tinytable:federation-test-20261008c
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: host-b-config
          env:
            - name: TINYTABLE_COMPANIONS_ONLY
              value: "1"
            - name: TINYTABLE_FEDERATION_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: host-b-identity
                  key: TINYTABLE_FEDERATION_PRIVATE_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: host-b-data
