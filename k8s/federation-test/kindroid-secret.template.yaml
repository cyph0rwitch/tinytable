apiVersion: v1
kind: Secret
metadata:
  name: tinytable-kindroid
  namespace: tinytable-federation-test
type: Opaque
stringData:
  # Store only digests in the application configuration. The session file
  # must be produced from a fresh, authorized Kindroid capture and must not be
  # committed or pasted into source control. The token is short-lived and the
  # sidecar rereads this file after projected-Secret rotation.
  KINDROID_ACCOUNT_HASH: "REPLACE_WITH_SHA256_ACCOUNT_OR_SESSION_ID"
  KINDROID_CHANNEL_HASH: "REPLACE_WITH_SHA256_KINDROID_AI_OR_CHANNEL_ID"
  KINDROID_SPEAKER_HASH: "REPLACE_WITH_SHA256_COMPANION_SPEAKER_ID"
  session.json: >-
    {"provider":"kindroid","channel_id":"kindroid:companion",
    "api_base":"https://api.kindroid.ai",
    "firestore_database":"projects/kindroid-ai/databases/(default)",
    "account_id":"REPLACE_WITH_KINDROID_ACCOUNT_ID",
    "ai_id":"REPLACE_WITH_KINDROID_AI_ID",
    "provider_channel_id":"REPLACE_WITH_KINDROID_AI_OR_CHANNEL_ID",
    "speaker_id":"REPLACE_WITH_COMPANION_SPEAKER_ID",
    "id_token":"REPLACE_WITH_SHORT_LIVED_ID_TOKEN",
    "firebase_api_key":"REPLACE_WITH_FIREBASE_API_KEY",
    "firebase_app_check":"REPLACE_WITH_SHORT_LIVED_FIREBASE_APPCHECK_TOKEN",
    "firebase_gmpid":"REPLACE_WITH_FIREBASE_GMPID",
    "goog_api_client":"REPLACE_WITH_X_GOOG_API_CLIENT",
    "client_platform":"web"}
