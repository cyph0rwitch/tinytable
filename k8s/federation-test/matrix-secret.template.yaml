# Copy, fill in, and apply out of band; never commit the filled-in copy.
apiVersion: v1
kind: Secret
metadata:
  name: tinytable-matrix
  namespace: tinytable-federation-test
type: Opaque
stringData:
  # Required to create accounts on the homeserver (scripts/matrix_bootstrap.py).
  REGISTRATION_TOKEN: "REPLACE_WITH_RANDOM_TOKEN"
  # Reusable, tagged auth key from the Tailscale admin console.
  TS_AUTHKEY: "REPLACE_WITH_TAILSCALE_AUTH_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: tinytable-matrix-bridge
  namespace: tinytable-federation-test
type: Opaque
stringData:
  # Printed by scripts/matrix_bootstrap.py.
  MATRIX_BRIDGE_ENABLED: "1"
  MATRIX_ROOM_ID: "REPLACE"
  MATRIX_OPERATOR_ID: "@operator:matrix.example.org"
  MATRIX_TINYTABLE_TOKEN: "REPLACE"
  MATRIX_COMPANION_A_TOKEN: "REPLACE"
  MATRIX_COMPANION_B_TOKEN: "REPLACE"
  TINYTABLE_OPERATOR_NAME: "Operator"
  TINYTABLE_COMPANION_A_NAME: "Companion A"
  TINYTABLE_COMPANION_B_NAME: "Companion B"
  # The bridge's own channel token; only its SHA-256 goes to the TinyTable
  # container, and the operator token never enters the pod.
  TINYTABLE_OPERATOR_TOKEN: "REPLACE_WITH_RANDOM_BRIDGE_TOKEN"
  TINYTABLE_MATRIX_BRIDGE_TOKEN_SHA256: "REPLACE_WITH_SHA256_OF_BRIDGE_TOKEN"
