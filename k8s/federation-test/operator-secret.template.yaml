apiVersion: v1
kind: Secret
metadata:
  name: tinytable-operator
  namespace: tinytable-federation-test
type: Opaque
stringData:
  # SHA-256 hex digest of the operator bearer token used by
  # `tinytable-cli channel`. The raw token stays on the operator's machine
  # (~/.config/tinytable/operator-token, mode 600); the pod never sees it.
  TINYTABLE_OPERATOR_TOKEN_SHA256: "REPLACE_WITH_SHA256_OF_OPERATOR_TOKEN"
